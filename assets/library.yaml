# La bibliothèque de mingets de l'éditeur : des macros toutes faites, que l'on
# copie dans un service pour les utiliser. Même écriture que la section `macros:`
# d'un service (forme étendue : paramètres nommés, typés, avec leur défaut).
#
# Règles : une définition par entrée, la clé seule sur sa ligne (`  nom:`), des
# commentaires juste au-dessus pour la documenter (ils sont copiés avec la
# définition), des définitions autonomes (sans appel d'une autre macro).
# Ces définitions viennent de l'exemple de Minserve (example/service.yaml).
macros:
  # Un titre centré en double hauteur : [ligne, texte]. La colonne se calcule d'après la longueur du
  # texte (40 colonnes, la double hauteur ne change pas la largeur) ; un texte de plus de 40
  # caractères commence en colonne 1.
  titre-centre:
    description: "Un titre centré en double hauteur : la colonne se calcule d'après la longueur du texte"
    parametres:
      - {nom: ligne, type: entier, defaut: 4, min: 1, max: 23}
      - {nom: texte, type: texte, defaut: "Titre", description: "Le titre (40 caractères au plus)"}
    ecran:
      - position: {ligne: $1, col: "$(max(1, (40 - longueur($2)) / 2 + 1))"}
      - doublehauteur                            # aussi : doublelargeur, doubletaille, taillenormale
      - ecrit: "$2"

  # Le titre d'une page : [ligne, texte].
  titre-simple:
    description: "Le titre d'une page : bandeau rouge, texte en double hauteur"
    parametres:
      - {nom: ligne, type: entier, defaut: 1, min: 1, max: 23}
      - {nom: texte, type: texte, defaut: "Titre de la page"}
    ecran:
      - position: {ligne: $1, col: 1}
      - couleur: {fond: rouge}
      - ecrit: " "
      - effacefindeligne
      - doublehauteur
      - ecrit: "$2"

  # La ligne magenta (ligne 23) au-dessus de la zone de saisie.
  regle:
    description: "Une ligne magenta sur la ligne 23, au-dessus de la zone de saisie"
    ecran:
      - position: {ligne: 23, col: 1}
      - couleur: {texte: magenta}
      - repete: {caractere: "_", nombre: 40}

  # Le bandeau bleu de la zone de saisie : « Votre choix : ».
  choix:
    description: "Le bandeau bleu « Votre choix : » de la zone de saisie"
    ecran:
      - couleur: {texte: blanc, fond: bleu}
      - ecrit: " Votre choix :"
      - effacefindeligne

  # Un fond en double hauteur : [L, C, ligs, cols, couleur, bord]. (L, C) est le coin en haut à gauche
  # de l'ensemble, bord compris. Chaque ligne est en double hauteur (2 lignes d'écran) ; l'intérieur est
  # une bande de « cols » colonnes de la « couleur » donnée, entre un bord à gauche (« } », « { ») et un
  # bord à droite (« { »), avec un trait « _ » au-dessus et un trait « ~ » en dessous. Il faut que
  # C + cols + 3 tienne dans les 40 colonnes, et L + 2 * ligs + 1 dans les 24 lignes. « bord » vaut 1
  # (bord affiché) ou 0 (la bande seule, qui commence alors en colonne C) : une macro ne sait pas encore
  # tester un booléen, on répète donc les éléments du bord « bord » fois, c'est-à-dire une fois ou pas
  # du tout.
  fond:
    description: "Un fond en double hauteur : position, taille, couleur, bord affiché ou non"
    parametres:
      - {nom: L, type: entier, defaut: 1, min: 1, max: 21, description: "Ligne du coin en haut à gauche"}
      - {nom: C, type: entier, defaut: 1, min: 1, max: 37, description: "Colonne du coin en haut à gauche"}
      - {nom: ligs, type: entier, defaut: 11, min: 1, max: 11, description: "Nombre de lignes, chacune en double hauteur (2 lignes d'écran)"}
      - {nom: cols, type: entier, defaut: 36, min: 1, max: 40, description: "Largeur de la bande intérieure"}
      - {nom: couleur, type: texte, defaut: "rouge", description: "Couleur de la bande : noir, rouge, vert, jaune, bleu, magenta, cyan ou blanc"}
      - {nom: bord, type: entier, defaut: 1, min: 0, max: 1, description: "1 : bord affiché, 0 : sans bord"}
    ecran:
      # Le trait du haut.
      - fois:
          nombre: $6
          ecran:
            - position: {ligne: $1, col: "$($2 + 1)"}
            - repete: {caractere: "_", nombre: "$($4 + 1)"}

      # Les lignes : la ligne i est à la ligne d'écran L + 2 + 2 * i.
      - fois:
          nombre: $3
          variable: i
          ecran:
            - position: {ligne: "$($1 + 2 + 2 * $i)", col: $2}
            - doublehauteur
            # Le bord de gauche.
            - fois:
                nombre: $6
                ecran:
                  - ecrit: "}"
            - couleur: {texte: $5}
            - inversion: actif
            - fois:
                nombre: $6
                ecran:
                  - ecrit: "{"
            # La bande.
            - repete: {caractere: " ", nombre: $4}
            # Le bord de droite.
            - couleur: {texte: blanc}
            - inversion: inactif
            - fois:
                nombre: $6
                ecran:
                  - ecrit: "{"

      # Le trait du bas, juste sous la dernière ligne (ligne d'écran L + 2 * ligs + 1).
      - fois:
          nombre: $6
          ecran:
            - position: {ligne: "$($1 + 2 * $3 + 1)", col: "$($2 + 1)"}
            - repete: {caractere: "~", nombre: "$($4 + 1)"}


  # Le cadre en relief d'un menu, sans son fond : [L, C, ligs, cols, couleur]. (L, C) est son coin en
  # haut à gauche. Il fait « ligs » + 4 lignes de haut (la barre du haut, la bande foncée, « ligs »
  # lignes de texte, le bas, l'ombre) et « cols » colonnes de large, plus le bord de droite (« o »,
  # « j » et un bloc plein en haut) juste après, en colonne C + cols. La « couleur » est celle des
  # motifs du relief. Le fond qui l'entourait se dessine à part (voir « fond »). Chaque ligne est
  # placée par un « position » (la couleur et le mode semi-graphique sont à refaire à chaque ligne).
  # Il faut que C + cols tienne dans les 40 colonnes et L + ligs + 3 dans les 24 lignes.
  cadre-3d:
    description: "Un cadre en relief pour un menu, sans fond : position, taille et couleur au choix"
    parametres:
      - {nom: L, type: entier, defaut: 1, min: 1, max: 21, description: "Ligne du coin en haut à gauche"}
      - {nom: C, type: entier, defaut: 1, min: 1, max: 37, description: "Colonne du coin en haut à gauche"}
      - {nom: ligs, type: entier, defaut: 11, min: 1, max: 11, description: "Nombre de lignes de texte dans le cadre"}
      - {nom: cols, type: entier, defaut: 36, min: 1, max: 40, description: "Largeur du cadre, sans son bord de droite"}
      - {nom: couleur, type: texte, defaut: "rouge", description: "Couleur du relief : noir, rouge, vert, jaune, bleu, magenta, cyan ou blanc"}
    ecran:
      - position: {ligne: $1, col: $2}
      - couleur: {texte: $5, fond: cyan}
      - graphique
      - repete: {caractere: "/", nombre: $4}
      - couleur: {fond: noir}
      - ecrit: "\x7f"
      - position: {ligne: "$($1 + 1)", col: $2}
      - couleur: {texte: magenta, fond: vert}
      - graphique
      - repete: {caractere: "|", nombre: $4}
      - couleur: {texte: $5, fond: noir}
      - ecrit: "o"

      - fois:
          nombre: $3
          variable: i
          ecran:
            - position: {ligne: "$($1 + 2 + $i)", col: $2}
            - couleur: {texte: $5, fond: magenta}
            - graphique
            - repete: {caractere: " ", nombre: $4}
            - couleur: {fond: noir}
            - ecrit: "j"

      - position: {ligne: "$($1 + 2 + $3)", col: $2}
      - couleur: {texte: $5, fond: magenta}
      - graphique
      - repete: {caractere: "p", nombre: $4}
      - couleur: {fond: noir}
      - ecrit: "j"

      - position: {ligne: "$($1 + 3 + $3)", col: $2}
      - couleur: {texte: bleu, fond: $5}
      - graphique
      - ecrit: "#"
      - couleur: {texte: bleu, fond: noir}
      - repete: {caractere: "#", nombre: $($4 - 1)}
      - couleur: {texte: $5}
      - ecrit: "j"
