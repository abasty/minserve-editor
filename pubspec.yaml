name: minserve_editor
description: "Graphical editor for Minserve services"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.1.0+1

environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.1.9
  yaml: ^3.1.4
  minserve_core:
    path: ../minserve/packages/minserve_core
  minterm_view:
    path: ../minterm/packages/minterm_view
  yaml_edit: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/library.yaml
  fonts:
    - family: DejaVuSansMono
      fonts:
        - asset: assets/fonts/DejaVuSansMono.ttf

